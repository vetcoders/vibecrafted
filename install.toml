# Vibecrafted install manifest — consumed by the built-in vetcoders-installer
# under scripts/installer/.
#
#   make install                          (terminal wizard, the default)
#   make setup-dev                        (same meta-installer, advanced options)
#   make wizard                           (browser-based GUI, optional)
#   uv run --project scripts/installer vetcoders-installer install.toml --dry-run
#
# Copy is taken verbatim from the author's mocks in docs/installer/*.md.
# The installer's intro flow renders richer TTY screens when available. These
# four phases are the fallback and consent checkpoints for the shell path.

title = "⚒ Vibecrafted."
version_file = "VERSION"
log = "~/.vibecrafted/logs/installer/install-{ts}.log"

# Keep the installer tool around: vibecrafted ships `vibecrafted update`
# which re-runs this manifest, so the tool stays useful post-bootstrap.
persist = true


[[phase]]
key = "introduction"
label = "Introduction"
reason = """
We will install 𝚅𝚒𝚋𝚎𝚌𝚛𝚊𝚏𝚝𝚎𝚍. as a local-first framework for agent-assisted
development. This step is intentionally quiet: it names the product, the install
surface, and the fact that every durable write below has a reason.
"""
cmd = ["python3", "-c", "pass"]


[[phase]]
key = "diagnostics"
label = "Diagnostics and plan"
reason = """
We will inspect the current machine before changing files.

Required decision:
  Set your artifacts storage location.
  REASON: 𝚅𝚒𝚋𝚎𝚌𝚛𝚊𝚏𝚝𝚎𝚍. keeps the persistent artifacts on developer's hard disks
  for past session context retrieval. We make this location explicit so reports,
  transcripts, and run state can be inspected, moved, backed up, or deleted.
  Default: ${VIBECRAFTED_HOME:-$HOME/.vibecrafted}/artifacts

Installer options live in one place:
  runtime horse · skill views · Python tools · dry-run or automation mode
"""
cmd = [
    "python3",
    "scripts/vetcoders_install.py",
    "list",
    "--source", ".",
]
optional = true


[[phase]]
key = "installation"
label = "Installation"
reason = """
We will install the backyard product spine (one path, no install loops):

  - product foundations: loctree / aicx (canonical product installers)
  - vc-frame donor BINARY built from sibling source and installed only by
    Vibecrafted (no companion installer or release channel)
  - framework-owned support tools when needed
  - frontier config + operator scripts (Composer / Super binds projection)
  - shared skills, launchers, and mirrored agent views
  - the selected runtime horse when RUNTIME=... is provided
  - the Python CLI and MCP packages through uv tool install
  - vendored foundation binaries from bin/vendor/<platform> when present
  - Rust app/server binaries (voc, vc-admin, vc-server) in ~/.local/bin

The public macOS install is one Vibecrafted.app carrying vc-terminal, vc-frame,
vc-start, and the Vibecrafted runtime. It does not rewrite user shell or terminal
configuration; the app injects only its bundled environment at process start.
"""
cmd = [
    "bash",
    "-e",
    "-c",
    '''
bash scripts/install-foundations.sh
bash scripts/install-runtime.sh --runtime "${VIBECRAFTED_RUNTIME:-none}" --yes
make --no-print-directory install-vendored-binaries
make --no-print-directory install-app-binaries
make --no-print-directory install-bundle-tools
stable_root="${XDG_DATA_HOME:-$HOME/.local/share}/vibecrafted/tools/vibecrafted-current"
bash "$stable_root/vibecrafted-core/vibecrafted_core/runtime/scripts/install-frontier-config.sh" --source "$stable_root" || printf '[warn] Frontier config skipped (non-fatal)\n'
# Project Super binds + operator scripts onto frontier (living install path).
if command -v vibecrafted >/dev/null 2>&1; then
  vibecrafted config install || printf '[warn] vibecrafted config install skipped (non-fatal)\n'
elif [[ -x scripts/vetcoders_install.py ]]; then
  python3 -c "from vibecrafted_core.vc_frame_delivery import stage_vc_frame_config; print(stage_vc_frame_config().render())" 2>/dev/null \
    || printf '[warn] config projection skipped (non-fatal)\n'
fi
''',
]


[[phase]]
key = "onboarding"
label = "Onboarding"
reason = """
Health check, then the product question:

  Launch Vibecrafted now? [Y/n]

On Y we open the operator session (vc-start) with the Start here tab —
the map of the workspace (rail, chrome, keys). That is onboarding content
already in the frame layout; the installer only wires the door.

Restore honesty: layout/session resurrection is frame-level. Full agent
process freeze is NOT claimed here (docs/installer/RESTORE_CONTRACT.md).
"""
cmd = [
    "bash",
    "-e",
    "-c",
    '''
python3 scripts/vetcoders_install.py doctor || true
bash scripts/post-install-launch.sh
''',
]
optional = true

[branding]
header = "⚒ V A P O R C R A F T ⚒"
name = "Vibecrafted."
tagline = "The framework for making real products with agent CLIs."
footer_tagline = "You can Vibecraft your first project now!"
installer_cmd = "make install"

[intro]
screens = [
    "0_welcome_step.zsh.md",
    "1_Explain_step.zsh.md",
    "2_listing.zsh.md"
]
textual_screens = [
    "0_welcome_step.zsh.md",
    "1_Explain_step.zsh.md",
    "2_listing.zsh.md",
    "3_examine.zsh.md",
    "4_result.zsh.md",
    "5_installation.zsh.md"
]

[diagnostics]
categories = ["frameworks", "foundations", "toolchains", "agents", "additional_tools"]

[diagnostics.labels]
frameworks = "Frameworks"
foundations = "Foundations"
toolchains = "Toolchains"
agents = "Agents"
additional_tools = "Additional tools"

[diagnostics.commands]
foundations = ["loctree-mcp", "aicx-mcp", "prview", "screenscribe"]
toolchains = ["python3", "node", "git", "rsync"]
agents = ["claude", "codex", "agy", "junie", "grok", "cursor-agent"]
additional_tools = ["mise", "starship", "atuin", "zoxide"]

[diagnostics.paths]
store_dir = "$VIBECRAFTED_ROOT/.vibecrafted/skills"
helpers = "$XDG_CONFIG_HOME/vetcoders/vc-skills.sh"
binaries = ["vibecraft", "vibecrafted"]
symlinks = ["$HOME/.agents", "$HOME/.claude", "$HOME/.codex", "$HOME/.gemini", "$HOME/.agy", "$HOME/.junie", "$HOME/.grok"]

[runtime]
default = "none"
available = ["wezterm", "vc-apprt", "locterm", "microsandbox"]

[runtime.picking.research]
default_agents = ["claude", "codex", "agy"]
fallback_agents = ["grok", "junie", "agy"]
reason = "Research needs three reliable independent workers. Claude, Codex, and Agy are the packaged defaults; per-user runtime picks can override this in ~/.config/vibecrafted/config.toml without reinstalling."

[runtime.horses.wezterm]
label = "WezTerm"
source = "$HOME/.vibecrafted/vc-runtime/wezterm"
lab = "$HOME/.vibecrafted/vc-runtime/labs/wezterm-spine"
platforms = ["macos", "linux", "wsl"]
artifacts = ["wezterm", "$XDG_CONFIG_HOME/wezterm/vibecrafted"]

[runtime.horses.vc-apprt]
label = "vc-apprt"
source = "$HOME/.vibecrafted/vc-runtime/vc_"
lab = "$HOME/.vibecrafted/vc-runtime/labs/vc-apprt-spine"
platforms = ["macos", "linux"]
artifacts = ["vc_"]
requires = ["zig 0.16"]

[runtime.horses.locterm]
label = "locterm"
source = "$HOME/.vibecrafted/vc-runtime/locterm"
lab = "$HOME/.vibecrafted/vc-runtime/labs/locterm-spine"
platforms = ["macos"]
artifacts = ["locterm.app", "iTerm2 AutoLaunch vc_launcher.py"]

[runtime.horses.microsandbox]
label = "microsandbox"
source = "$HOME/.vibecrafted/vc-runtime/experimental/microsandbox"
lab = "$HOME/.vibecrafted/vc-runtime/labs/microsandbox-execution"
platforms = ["macos", "linux"]
artifacts = ["msb", "msbserver"]
requires = ["krunvm", "libkrun"]
