[tool.uv.workspace]
members = [
    "vibecrafted-core",
    "vibecrafted-mcp",
    "vibecrafted-acp",
    "plugins/iterm2",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
    "textual>=8.2.3",
]

[tool.ruff.lint.per-file-ignores]
# tests whose imports legitimately follow a sys.path setup.
"tests/agent_dispatch_test.py" = ["E402"]
"tests/tui/test_installer_branding.py" = ["E402"]
"tests/tui/test_installer_manifest.py" = ["E402"]
"tests/tui/test_research_terminal_safety.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = [
    "vibecrafted-core/vibecrafted_core",
    "vibecrafted-mcp/vibecrafted_mcp",
    "vibecrafted-acp/vibecrafted_acp",
]
exclude = [
    "^skills/",
    "^runtime/",
    "^tests/",
    "^vibecrafted-core/tests/",
    "^vibecrafted-mcp/tests/",
    "^plugins/iterm2/tests/",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["vibecrafted-core", "vibecrafted-acp"]
