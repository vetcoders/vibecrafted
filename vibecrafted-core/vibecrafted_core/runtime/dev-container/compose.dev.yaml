# Persistent, per-repo local container for interactive Agents.
#
# Owner: vibecrafted_core.dev_container (the Agents launcher "local container"
# environment; runtime-policy key `local-vm`). It builds Dockerfile.dev into
# `vibecrafted-dev:recipe-<digest>` (the digest of this recipe directory) and
# runs:  VC_WORKSPACE_DIR=<repo> VC_DEV_IMAGE=<tag> \
#          docker compose -p vc-<repo-slug> -f compose.dev.yaml up -d --no-build
# Manual entry:  vibecrafted-vm/dev-up.sh [repo-path]
# Enter shell:   docker compose -p vc-<repo-slug> -f compose.dev.yaml exec dev zsh
#
# Per-repo isolation comes from the Compose PROJECT NAME (-p vc-<slug>), which
# prefixes the named volumes below. That is what makes the container
# NON-EPHEMERAL: `down` (without -v) and `up` again keep every agent's session
# history and the AICX corpus. Use `down -v` only when you want to wipe history.
#
# This is a local development container, not a VM and not a security
# boundary. Do not combine with the broad host mounts of vibecrafted-vm/compose.yaml.
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ${VC_DEV_IMAGE:-vibecrafted-dev:debian13}
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      # Tailnet is optional; the node only joins when an auth key is supplied.
      - TAILSCALE_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TAILSCALE_HOSTNAME=${TAILSCALE_HOSTNAME:-}
      - TAILSCALE_TAGS=${TAILSCALE_TAGS:-}
      - AICX_NO_MUTATION_WARN=${AICX_NO_MUTATION_WARN:-0}
      - VC_DEV_SKIP_SYNC=${VC_DEV_SKIP_SYNC:-0}
      - TERM=${TERM:-xterm-256color}
      - COLORTERM=${COLORTERM:-truecolor}
    volumes:
      # The repository under work, mounted live. Required: a default would
      # silently mount whatever directory sits next to this recipe.
      - ${VC_WORKSPACE_DIR:?set VC_WORKSPACE_DIR to the repository to mount}:/workspace:rw
      # Cross-agent session history + memory — the whole point of this container.
      # Persisted across down/up/rebuild by the project-prefixed named volumes.
      - aicx:/root/.aicx
      - vibecrafted:/root/.vibecrafted
      - claude:/root/.claude
      - codex:/root/.codex
      - gemini:/root/.gemini
      - kimi:/root/.kimi-code
      # Keep the existing volume identity while persisting the canonical config.
      - vetcoders-config:/root/.config/vibecrafted
      # Tailscale node identity (kept across restarts).
      - tailscale-state:/var/lib/tailscale

volumes:
  aicx:
  vibecrafted:
  claude:
  codex:
  gemini:
  kimi:
  vetcoders-config:
  tailscale-state:
