# Rehearse the same source gate used by tags, before tagging the exact SHA.
name: Release gate rehearsal (macOS)

on:
  pull_request:
    branches:
      - main
    paths:
      - "VERSION"
      - "CHANGELOG.md"
      - "plugin.json"
      - "vibecrafted-core/**"
      - "vibecrafted-mcp/**"
      - "vibecrafted-app/**"
      - "vibecrafted-server/**"
      - "tests/**"
      - "scripts/**"
      - "install.sh"
      - "Makefile"
      - "vetcoders.zsh"
      - "docs/RELEASE_KICKOFF.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/gate-rehearsal.yml"
      - ".github/workflows/source-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate-rehearsal:
    uses: ./.github/workflows/source-gate.yml
    with:
      verify_tag: false
