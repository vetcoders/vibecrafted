name: Release source gate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  source-gate:
    # The unified product contract compiles, signs, and inspects a real Mach-O
    # fixture. Running this release-only gate on Linux makes the immutable tag
    # fail after all portable tests pass because xcrun/codesign are unavailable.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release source
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          release_tag_ref="refs/vibecrafted-release-tags/$GITHUB_REF_NAME"
          git fetch --force --no-tags origin \
            "refs/tags/$GITHUB_REF_NAME:$release_tag_ref"
          test "$(git cat-file -t "$release_tag_ref")" = "tag"
          test "$(git rev-list -n 1 "$release_tag_ref")" = "$GITHUB_SHA"

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Run shell checks
        run: make check

      - name: Run unified product contract gate
        run: make unified-product-contract-gate

      - name: Run core runtime tests
        run: make test-core

      - name: Run Semgrep security gate
        run: make semgrep

      - name: Run installer and product tests
        run: make test

      # The portable channel is the only artifact non-macOS users ever get, so
      # the tag gate must prove it builds from the immutable tag source — not
      # just that a script exists. It needs no signing identity and no notary
      # account, and it self-verifies what it writes, so it is cheap to gate.
      - name: Build the portable release channel
        run: make portable

      # POSIX grep, not ripgrep: this job runs on the bare GitHub macos-15
      # image, which ships neither ripgrep nor shellcheck — the latter is
      # why the `brew install shellcheck` step above exists. The earlier
      # spelling forced a lookup of a real rg binary on PATH, so this step
      # would have failed the whole gate after every test had already
      # passed: the exact shape of the v4.0.0 xcrun death, four steps
      # later. It arrived in ef700e52 (3.7.1) and every tag since died
      # earlier, so it has never once executed. These are literal presence
      # assertions over enumerated files, which is what grep is for.
      - name: Confirm publication boundary for both channels
        run: |
          set -euo pipefail
          test -x scripts/publish-vibecrafted-release.sh
          test -x scripts/build-portable-release.sh
          grep -nE 'Vibecrafted_.*YYYYMMDD|DMG_NAME|\.dmg\.sha256' \
            scripts/build-vibecrafted-release.sh \
            scripts/publish-vibecrafted-release.sh \
            docs/RELEASE_KICKOFF.md
          grep -nE 'PORTABLE_NAME|portable\.tar\.gz|portable-output\.json' \
            scripts/build-portable-release.sh \
            scripts/publish-vibecrafted-release.sh \
            docs/RELEASE_KICKOFF.md
