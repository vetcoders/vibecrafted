name: Portable Checks

# PR-first event matrix:
# - feature push: no run (open a PR)
# - pull_request open/synchronize: run; group includes the PR number
# - push to main: post-merge default-branch check
# - merge_group: merge-queue check; cancel-in-progress is false
# - tag: no run (Release source gate owns tags)
# Required names preserved: "portable (macos-latest, macOS)" and
# "portable (ubuntu-latest, Linux)" — do not add a job-level name here.

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  portable:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os: macOS
          - runner: ubuntu-latest
            os: Linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Pin Rust toolchain for sandboxed bootstrap
        shell: bash
        run: |
          # tests/portable/run.sh sandboxes HOME to a temp dir for isolation,
          # which hides the runner's ~/.rustup/settings.toml from rustup and
          # makes `cargo` fail with "no default toolchain configured" during
          # install-app-binaries. Pin RUSTUP_HOME/CARGO_HOME to the real
          # (absolute) toolchain so the sandboxed-HOME bootstrap still resolves
          # a default toolchain. A real user keeps their own HOME, so this is a
          # harness-only concern, not an install.sh bug.
          rustup default stable
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
      - name: Provision leptos toolchain for the server shell build
        shell: bash
        run: |
          # install-bundle-tools builds the interactive server shell with
          # cargo-leptos, and the target is deliberately FATAL when cargo
          # exists but cargo-leptos does not (half a toolchain would ship a
          # server without hydration assets). cargo-binstall pulls prebuilt
          # binaries in seconds instead of a multi-minute cargo install
          # compile; wasm-bindgen-cli is pinned to Cargo.lock because the
          # build refuses a version-skewed CLI.
          rustup target add wasm32-unknown-unknown
          curl -L --proto '=https' --tlsv1.2 -sSf -o /tmp/install-binstall.sh https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh
          bash /tmp/install-binstall.sh
          cargo binstall -y cargo-leptos
          lock_version="$(cargo tree --locked --manifest-path vibecrafted-server/Cargo.toml -p wasm-bindgen --depth 0 --prefix none | awk 'NR == 1 { sub(/^v/, "", $2); print $2 }')"
          cargo binstall -y "wasm-bindgen-cli@${lock_version}"
      - name: Install shellcheck on Linux
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          # libgtk-3-dev + libxdo-dev + appindicator: the portable bootstrap's
          # `make install-app-binaries` builds voc, whose arboard clipboard dep
          # links gtk-sys/glib-sys on Linux. libgtk-3-dev transitively provides
          # the glib-2.0/gdk/pango/cairo/atk pkg-config files the build needs.
          sudo apt-get install -y \
            build-essential \
            cmake \
            libclang-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            protobuf-compiler \
            rsync \
            shellcheck \
            zsh
      - name: Install shellcheck on macOS
        if: matrix.os == 'macOS'
        run: brew install shellcheck
      - name: Run shell checks
        run: make check
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Pin uv to a managed Python on macOS
        if: matrix.os == 'macOS'
        run: |
          # Homebrew's framework CPython resolves sys.executable through
          # symlinks, which hides the generation interpreter from the
          # runtime-bootstrap PYTHONPATH scrub and fails the installed-spawn
          # installer tests. A uv-managed CPython keeps the invoked path,
          # matching the operator lane and production Runtime Packs.
          echo "UV_PYTHON_PREFERENCE=only-managed" >> "$GITHUB_ENV"
      - name: Run Semgrep security gate
        run: make semgrep
      - name: Run installer tests
        timeout-minutes: 120
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            test_uid="$(id -u)"
            test_gid="$(id -g)"
            test_user="$(id -un)"
            test_pid_ns="$(readlink /proc/self/ns/pid)"
            [[ "$test_uid" != 0 ]]
            test_state="$(mktemp -d "$RUNNER_TEMP/vc-installer-tests.XXXXXX")"
            trap 'rm -rf -- "$test_state"' EXIT
            test_env=(
              "PATH=$PATH" "HOME=$HOME" "USER=$test_user" "LOGNAME=$test_user"
              "CI=${CI:-true}" "GITHUB_ACTIONS=${GITHUB_ACTIONS:-true}"
              "RUNNER_TEMP=$RUNNER_TEMP" "PYTEST_ADDOPTS=$PYTEST_ADDOPTS"
              "VIBECRAFTED_HOME=$test_state"
            )
            # Keep setup-uv path/mode and the earlier pinned Rust toolchain paths.
            for key in UV_CACHE_DIR UV_PYTHON_PREFERENCE RUSTUP_HOME CARGO_HOME; do
              if [[ -n "${!key:-}" ]]; then
                test_env+=("$key=${!key}")
              fi
            done
            sudo -n /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C \
              /usr/bin/unshare --pid --fork --kill-child --mount-proc --propagation private \
              /usr/bin/setpriv --reuid="$test_uid" --regid="$test_gid" --clear-groups \
              --inh-caps=-all --ambient-caps=-all --bounding-set=-all \
              --no-new-privs --pdeathsig keep --reset-env \
              /usr/bin/env -i "${test_env[@]}" /bin/bash -euc '
                [[ "$(id -u)" == "$1" && "$(id -g)" == "$2" ]]
                [[ "$$" == 1 && "$(pwd -P)" == "$3" ]]
                [[ "$(readlink /proc/self/ns/pid)" != "$4" ]]
                cap_count=0
                no_new_privs=0
                while read -r key value; do
                  case "$key" in
                    CapInh:|CapPrm:|CapEff:|CapBnd:|CapAmb:)
                      [[ "$value" =~ ^0+$ ]]
                      cap_count=$((cap_count + 1))
                      ;;
                    NoNewPrivs:) no_new_privs="$value" ;;
                  esac
                done < /proc/self/status
                [[ "$cap_count" == 5 && "$no_new_privs" == 1 ]]
                printf "installer test namespace uid=%s gid=%s pid=%s\n" "$1" "$2" "$$"
                exec make test-source
              ' _ "$test_uid" "$test_gid" "$(pwd -P)" "$test_pid_ns"
          else
            make test-source
          fi
        env:
          PYTEST_ADDOPTS: "-vv -o faulthandler_timeout=120"
      - name: Build marketplace bundle
        run: make bundle
      - name: Install rsync on Linux
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get install -y rsync
      - name: Run portable checks
        run: bash scripts/check-portable.sh

  curl-bootstrap:
    name: Runtime Pack bootstrap (${{ matrix.os }})
    needs: portable
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os: macOS
          - runner: ubuntu-latest
            os: Linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Build canonical source side of the release tuple
        run: |
          archive="/tmp/vibecrafted-bootstrap.tar.gz"
          source_revision="$(git rev-parse HEAD)"
          python3 scripts/distribution_manifest.py archive \
            --source "$GITHUB_WORKSPACE" \
            --output "$archive" \
            --root-name vibecrafted-bootstrap \
            --owner-repo "$GITHUB_REPOSITORY" \
            --source-revision "$source_revision"
      - name: Prove canonical carrier and bootstrap contract
        run: |
          env -u PYTHONPATH uv run --project vibecrafted-core --with pytest \
            python -m pytest tests/tui/test_runtime_pack_cli.py \
            tests/tui/test_install_bootstrap.py -q
