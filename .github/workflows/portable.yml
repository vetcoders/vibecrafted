name: Portable Checks

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os: macOS
          - runner: ubuntu-latest
            os: Linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Pin Rust toolchain for sandboxed bootstrap
        shell: bash
        run: |
          # tests/portable/run.sh sandboxes HOME to a temp dir for isolation,
          # which hides the runner's ~/.rustup/settings.toml from rustup and
          # makes `cargo` fail with "no default toolchain configured" during
          # install-app-binaries. Pin RUSTUP_HOME/CARGO_HOME to the real
          # (absolute) toolchain so the sandboxed-HOME bootstrap still resolves
          # a default toolchain. A real user keeps their own HOME, so this is a
          # harness-only concern, not an install.sh bug.
          rustup default stable
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
      - name: Provision leptos toolchain for the server shell build
        shell: bash
        run: |
          # install-bundle-tools builds the interactive server shell with
          # cargo-leptos, and the target is deliberately FATAL when cargo
          # exists but cargo-leptos does not (half a toolchain would ship a
          # server without hydration assets). cargo-binstall pulls prebuilt
          # binaries in seconds instead of a multi-minute cargo install
          # compile; wasm-bindgen-cli is pinned to Cargo.lock because the
          # build refuses a version-skewed CLI.
          rustup target add wasm32-unknown-unknown
          curl -L --proto '=https' --tlsv1.2 -sSf -o /tmp/install-binstall.sh https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh
          bash /tmp/install-binstall.sh
          cargo binstall -y cargo-leptos
          lock_version="$(cargo tree --locked --manifest-path vibecrafted-server/Cargo.toml -p wasm-bindgen --depth 0 --prefix none | awk 'NR == 1 { sub(/^v/, "", $2); print $2 }')"
          cargo binstall -y "wasm-bindgen-cli@${lock_version}"
      - name: Install shellcheck on Linux
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          # libgtk-3-dev + libxdo-dev + appindicator: the portable bootstrap's
          # `make install-app-binaries` builds voc, whose arboard clipboard dep
          # links gtk-sys/glib-sys on Linux. libgtk-3-dev transitively provides
          # the glib-2.0/gdk/pango/cairo/atk pkg-config files the build needs.
          sudo apt-get install -y \
            build-essential \
            cmake \
            libclang-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            protobuf-compiler \
            rsync \
            shellcheck \
            zsh
      - name: Install shellcheck on macOS
        if: matrix.os == 'macOS'
        run: brew install shellcheck
      - name: Run shell checks
        run: make check
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Run Semgrep security gate
        run: make semgrep
      - name: Run installer tests
        run: make test
      - name: Build marketplace bundle
        run: make bundle
      - name: Install rsync on Linux
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get install -y rsync
      - name: Run portable checks
        run: bash scripts/check-portable.sh

  curl-bootstrap:
    name: Runtime Pack bootstrap (${{ matrix.os }})
    needs: portable
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os: macOS
          - runner: ubuntu-latest
            os: Linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Build canonical source side of the release tuple
        run: |
          archive="/tmp/vibecrafted-bootstrap.tar.gz"
          source_revision="$(git rev-parse HEAD)"
          python3 scripts/distribution_manifest.py archive \
            --source "$GITHUB_WORKSPACE" \
            --output "$archive" \
            --root-name vibecrafted-bootstrap \
            --owner-repo "$GITHUB_REPOSITORY" \
            --source-revision "$source_revision"
      - name: Prove canonical carrier and bootstrap contract
        run: |
          env -u PYTHONPATH uv run --project vibecrafted-core --with pytest \
            python -m pytest tests/tui/test_runtime_pack_cli.py \
            tests/tui/test_install_bootstrap.py -q
