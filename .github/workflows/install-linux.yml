name: Install (Linux Matrix)

# Plan 03 (META_22) cross-platform install gate. Exercises the install.sh
# Linux path against Ubuntu (runner-native) and Debian (container) and
# verifies `vibecrafted doctor` reports green afterwards. Doctor stays green in
# headless CI because absent externally-managed product foundations
# (loctree/aicx/vc-frame) are reported as warnings, not failures.
#
# The Ubuntu job uses the GitHub-hosted runner directly so we exercise the
# real /etc/os-release detection and the apt-family hint path. The Debian
# job runs inside a debian:bookworm-slim container so we exercise the
# bare-minimum prereq install (no pre-baked tooling) — this is the most
# likely failure mode for a real Debian user.

on:
  push:
    branches:
      - main
      - develop
      - "release/*"
  pull_request:
    branches:
      - main
      - develop
      - "release/*"
  # The main ruleset requires this workflow's "docker build + doctor"
  # context, and the merge queue (HEADGREEN) waits for required contexts on
  # the queue head. Without a merge_group trigger this workflow can never
  # report there, so every queued merge deadlocks until the 60-minute
  # check_response_timeout kills the entry.
  merge_group:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Ubuntu 22.04 / 24.04 — runner-native. Tests the happy path.
  # ---------------------------------------------------------------------------
  ubuntu-native:
    name: install.sh (ubuntu-${{ matrix.runner-version }})
    env:
      # `cargo install aicx` is memory-heavy; keep CI runners from OOM-killing rustc.
      CARGO_BUILD_JOBS: "1"
    strategy:
      fail-fast: false
      matrix:
        runner-version: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner-version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show platform fingerprint
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          bash --version | head -1

      - name: Lint install.sh with shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n install.sh
          # The project excludes SC1091 (sourced env files we don't follow)
          # in scripts/check_shell.py — match that policy here.
          shellcheck -e SC1090,SC1091,SC2155,SC2034,SC2154,SC2015 install.sh

      # ubuntu-22.04 ships system Python 3.10, below the project floor
      # (requires-python >=3.11; vibecrafted_core imports tomllib, 3.11+ stdlib).
      # Pin a supported interpreter so `make install` runs on a version the code
      # actually targets, while the matrix still covers 22.04 vs 24.04 os-release.
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install make + python3 (already present, but be explicit)
        run: |
          set -euo pipefail
          # protobuf-compiler is required by `cargo install aicx` because the
          # transitive `lance-encoding` crate uses `prost-build`, which shells
          # out to `protoc` at build time. Without it the install fails with
          # "Could not find `protoc`". apt-get update already ran in the
          # lint step above for this job.
          # libgtk-3-dev + libxdo-dev + appindicator: `make install` builds the
          # `voc` app binary, whose dependency graph pulls tray-icon/muda ->
          # gtk-sys/glib-sys on Linux. libgtk-3-dev transitively provides the
          # glib-2.0/gdk/pango/cairo/atk pkg-config files the build needs.
          sudo apt-get install -y \
            build-essential \
            cmake \
            libclang-dev \
            libprotobuf-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            make \
            protobuf-compiler \
            python3 \
            python3-venv

      - name: Bootstrap the provenance-bound portable source carrier
        run: |
          set -euo pipefail
          portable_archive="${RUNNER_TEMP:-/tmp}/vibecrafted-linux-x64-portable.tar.gz"
          source_revision="$(git rev-parse HEAD)"
          python3 scripts/distribution_manifest.py archive \
            --source "$GITHUB_WORKSPACE" \
            --output "$portable_archive" \
            --root-name vibecrafted-ci-portable \
            --owner-repo "$GITHUB_REPOSITORY" \
            --source-revision "$source_revision"
          INSTALL_TOOLS_SERVICE_POLICY=isolated \
            bash install.sh --archive-file "$portable_archive" install-tools

      - name: Run vibecrafted doctor
        run: |
          set -euo pipefail
          # PATH adjustments mirror what the install.sh interactive path does
          # — make sure the staged CLI is visible to this step. Foundations
          # (loct/aicx/…) install into the runtime bin
          # (~/.local/share/vibecrafted/bin, wired by vc-start for real
          # users); without it here doctor reports INSTALLED_NOT_ON_PATH.
          export PATH="$HOME/.vibecrafted/bin:$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.local/share/vibecrafted/bin:$PATH"
          if command -v vibecrafted >/dev/null 2>&1; then
            # Neutral cwd: the deck resolves core via `python -m`, and a
            # checkout cwd shadows the installed (stamped) package tree with
            # the living tree — the launcher check rightly flags that as
            # unstamped. Real users run doctor from anywhere; so does CI.
            (cd "${RUNNER_TEMP:-/tmp}" && vibecrafted doctor)
          else
            # Fallback to the in-repo Makefile target if the staged CLI
            # isn't on PATH yet (smoke uses the repo source tree).
            make doctor
          fi

      - name: Run skill-loader smoke
        # Installed-runtime health is the immediately preceding owned gate.
        # Keep this step focused on skill loading before installer fixtures.
        run: bash tests/skill_loader_smoke.sh --doctor-preverified

      - name: Run install.sh / install.ps1 host smoke
        run: make test-install

  # ---------------------------------------------------------------------------
  # Debian 12 (Bookworm) — bare container. Tests the prereq pre-flight + hints.
  # ---------------------------------------------------------------------------
  debian-bookworm-container:
    name: install.sh (debian-12 container)
    runs-on: ubuntu-latest
    env:
      # debian:bookworm-slim runs with limited memory inside the job container.
      CARGO_BUILD_JOBS: "1"
    container:
      image: debian:bookworm-slim
    # bare debian:bookworm-slim ships dash as /bin/sh and no bash. The first
    # step installs bash; every subsequent step then runs under bash so the
    # existing `set -euo pipefail` boilerplate works as written.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install bare-minimum container deps
        # This step runs before bash is installed; pin it to sh and drop
        # `pipefail` (dash does not support it). Once apt-get pulls bash,
        # the job default kicks in for every later step.
        shell: sh
        run: |
          set -eu
          apt-get update
          # Match the pre-flight: tar + make + python3 + curl + git + ca-certs.
          # bash + coreutils are already present in debian-slim.
          # protobuf-compiler is required by `cargo install aicx` because the
          # transitive `lance-encoding` crate uses `prost-build`, which shells
          # out to `protoc` at build time.
          # libgtk-3-dev + libxdo-dev + appindicator: `make install` builds the
          # `voc` app binary (tray-icon/muda -> gtk-sys/glib-sys on Linux).
          # libgtk-3-dev transitively provides glib-2.0/gdk/pango/cairo/atk.
          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            build-essential \
            cmake \
            curl \
            git \
            libclang-dev \
            libprotobuf-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            make \
            protobuf-compiler \
            python3 \
            python3-venv \
            shellcheck \
            sudo \
            tar

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show platform fingerprint
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          bash --version | head -1

      - name: Lint install.sh with shellcheck
        run: |
          set -euo pipefail
          bash -n install.sh
          shellcheck -e SC1090,SC1091,SC2155,SC2034,SC2154,SC2015 install.sh

      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh -o uv-install.sh && sh uv-install.sh
          # Persist for downstream steps in this job
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # debian:bookworm-slim ships no Rust toolchain. `make install` builds the
      # voc/vc-admin/vc-server binaries from source, so install cargo here. The
      # GitHub-hosted ubuntu runners have Rust preinstalled; only the container
      # needs this.
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh && sh rustup-init.sh -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Bootstrap the provenance-bound portable source carrier
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          # actions/checkout registers safe.directory only in a TEMPORARY git
          # config (under an overridden HOME); this step's git calls run with
          # the job HOME and hit "dubious ownership" on the mounted workspace.
          git config --global --add safe.directory "$(pwd)"
          portable_archive="${RUNNER_TEMP:-/tmp}/vibecrafted-linux-x64-portable.tar.gz"
          source_revision="$(git rev-parse HEAD)"
          python3 scripts/distribution_manifest.py archive \
            --source "$GITHUB_WORKSPACE" \
            --output "$portable_archive" \
            --root-name vibecrafted-ci-portable \
            --owner-repo "$GITHUB_REPOSITORY" \
            --source-revision "$source_revision"
          INSTALL_TOOLS_SERVICE_POLICY=isolated \
            bash install.sh --archive-file "$portable_archive" install-tools

      - name: Run vibecrafted doctor
        run: |
          set -euo pipefail
          export PATH="$HOME/.vibecrafted/bin:$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.local/share/vibecrafted/bin:$PATH"
          if command -v vibecrafted >/dev/null 2>&1; then
            # Neutral cwd: the deck resolves core via `python -m`, and a
            # checkout cwd shadows the installed (stamped) package tree with
            # the living tree — the launcher check rightly flags that as
            # unstamped. Real users run doctor from anywhere; so does CI.
            (cd "${RUNNER_TEMP:-/tmp}" && vibecrafted doctor)
          else
            make doctor
          fi

      - name: Run skill-loader smoke
        run: |
          set -euo pipefail
          export PATH="$HOME/.vibecrafted/bin:$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.local/share/vibecrafted/bin:$PATH"
          # Installed-runtime health is the immediately preceding owned gate.
          bash tests/skill_loader_smoke.sh --doctor-preverified

      - name: Run install.sh / install.ps1 host smoke
        run: |
          set -euo pipefail
          export PATH="$HOME/.vibecrafted/bin:$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.local/share/vibecrafted/bin:$PATH"
          make test-install

  # ---------------------------------------------------------------------------
  # Docker build smoke — verifies the shipped Dockerfile still builds and
  # that `vibecrafted doctor` runs at build time. Separate job to keep
  # signal isolated from the host-native install paths above.
  # ---------------------------------------------------------------------------
  docker-build-smoke:
    name: docker build + doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build vibecrafted:ci-smoke
        run: docker build -t vibecrafted:ci-smoke .

      - name: Verify CLI inside container
        run: |
          set -euo pipefail
          docker run --rm vibecrafted:ci-smoke version
          # Run doctor; allow non-zero so we get the report in CI logs,
          # but require the image build itself to have succeeded above.
          docker run --rm vibecrafted:ci-smoke doctor || \
            echo "[ci] container doctor non-zero — captured for review"
