name: vibecrafted-server

on:
  push:
    paths:
      - "vibecrafted-server/**"
      - ".github/workflows/vibecrafted-server.yml"
    branches: [main, "feat/**", "fix/**", "docs/**"]
  pull_request:
    paths:
      - "vibecrafted-server/**"
      - ".github/workflows/vibecrafted-server.yml"
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vc-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-transcript:
    name: Windows transcript boundary
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vibecrafted-server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch tip
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: vibecrafted-server
      - name: Test atomic transcript open on Windows
        run: cargo test -p control-core --test transcript_open --test usage_report

  control-core:
    name: control-core tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Hosted SSR linking overflowed ring's 32-bit .debug_macro relocations
      # (run 36829545615). CI executes tests; it does not need full debug types.
      # Keep debug assertions/overflow checks and the complete test selection.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: vibecrafted-server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Pin action to full SHA (supply-chain). Install Rust *stable* channel via inputs.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch tip
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: vibecrafted-server
      - name: Agent docs present
        run: |
          test -s AGENTS.md
          test -s llms.txt
      - name: Format check
        run: cargo fmt --check --all
      - name: Test control-core
        run: cargo test -p control-core
      - name: Check web (ssr)
        run: cargo check -p vibecrafted-server-web --features ssr
      - name: Test web (ssr)
        run: cargo test -p vibecrafted-server-web --features ssr
