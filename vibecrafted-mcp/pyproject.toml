[project]
name = "vibecrafted-mcp"
version = "4.3.0"
description = "MCP server for the Vibecrafted operator framework — synthesis brain for the Vetcoders ecosystem."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0,<3",
    "vibecrafted>=3.2.0rc0",
]

[project.scripts]
vibecrafted-mcp = "vibecrafted_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibecrafted_mcp"]

[tool.hatch.build]
artifacts = ["vibecrafted_mcp/VERSION"]

[tool.uv.sources]
vibecrafted = { workspace = true }
