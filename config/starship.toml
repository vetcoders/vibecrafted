# Product default: path on line one, simple ❯ on line two.
add_newline = true

format = """$directory
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)"
home_symbol = "~"
