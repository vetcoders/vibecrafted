# Canonical Vibecrafted terminal host policy.
# Vibecrafted.app loads this file explicitly and never imports or mutates the
# user's Alacritty configuration.
[general]
live_config_reload = true

[terminal]
# Alacritty does not expand ${HOME} in [terminal].shell.program. /bin/zsh -lc
# expands XDG and execs the one product launcher the installer publishes.
shell = { program = "/bin/zsh", args = ["-lc", "exec \"${XDG_CONFIG_HOME:-$HOME/.config}/vibecrafted/vc-terminal/launch-primary-shell.zsh\" \"$VIBECRAFTED_RUNTIME_ROOT/bin/vc-start\" operator"] }

[window]
blur = true
opacity = 0.9
title = "𝓥𝓲𝓫𝓮𝓬𝓻𝓪𝓯𝓽𝓮𝓭."
decorations = "Transparent"
startup_mode = "Maximized"
padding = { x = 0, y = 0 }
dynamic_padding = true
option_as_alt = "Both"

[font]
size = 18.5

[font.offset]
x = -1
y = 2

[font.normal]
family = "Spot Mono"
style = "Regular"

[font.bold]
family = "Spot Mono"
style = "Regular"

[font.italic]
family = "Spot Mono"
style = "Regular"

[cursor]
style = { shape = "Underline", blinking = "On" }
vi_mode_style = { shape = "Beam", blinking = "Off" }

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\\t"
save_to_clipboard = true

# Open URLs and OSC-8 hyperlinks with the macOS system launcher.
[[hints.enabled]]
command = "/usr/bin/open"
hyperlinks = true
post_processing = true
persist = false
mouse = { enabled = true, mods = "Command" }
binding = { key = "O", mods = "Control|Shift" }
regex = '(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>"\s{-}\^⟨⟩`\\]+'

# Plain terminal output does not carry OSC-8 metadata. Recognize common local
# path shapes too, then remove an optional :line[:column] suffix before asking
# LaunchServices to open the file. Command is an explicit host gesture, so the
# Vibecrafted terminal host keeps this hint active even during mouse reporting.
[[hints.enabled]]
command = { program = "/bin/zsh", args = ["-lc", 'target="$0"; target="${target/#\~/$HOME}"; candidate="$target"; if [[ "$candidate" =~ ":[0-9]+$" ]]; then candidate="${candidate%:*}"; [[ "$candidate" =~ ":[0-9]+$" ]] && candidate="${candidate%:*}"; [[ -e "$candidate" ]] && target="$candidate"; fi; exec /usr/bin/open -- "$target"'] }
hyperlinks = false
post_processing = true
persist = false
mouse = { enabled = true, mods = "Command" }
binding = { key = "P", mods = "Control|Shift" }
regex = '(~|\.\.?|[A-Za-z0-9._@%+=,-]+)?(/[A-Za-z0-9._@%+=,~:-]+)+'


# Polish diacritics on either Option key, while keeping Option as Alt/Meta.
[[keyboard.bindings]]
key = "A"
mods = "Alt"
chars = "ą"

[[keyboard.bindings]]
key = "A"
mods = "Alt|Shift"
chars = "Ą"

[[keyboard.bindings]]
key = "C"
mods = "Alt"
chars = "ć"

[[keyboard.bindings]]
key = "C"
mods = "Alt|Shift"
chars = "Ć"

[[keyboard.bindings]]
key = "E"
mods = "Alt"
chars = "ę"

[[keyboard.bindings]]
key = "E"
mods = "Alt|Shift"
chars = "Ę"

[[keyboard.bindings]]
key = "L"
mods = "Alt"
chars = "ł"

[[keyboard.bindings]]
key = "L"
mods = "Alt|Shift"
chars = "Ł"

[[keyboard.bindings]]
key = "N"
mods = "Alt"
chars = "ń"

[[keyboard.bindings]]
key = "N"
mods = "Alt|Shift"
chars = "Ń"

[[keyboard.bindings]]
key = "O"
mods = "Alt"
chars = "ó"

[[keyboard.bindings]]
key = "O"
mods = "Alt|Shift"
chars = "Ó"

[[keyboard.bindings]]
key = "S"
mods = "Alt"
chars = "ś"

[[keyboard.bindings]]
key = "S"
mods = "Alt|Shift"
chars = "Ś"

[[keyboard.bindings]]
key = "X"
mods = "Alt"
chars = "ź"

[[keyboard.bindings]]
key = "X"
mods = "Alt|Shift"
chars = "Ź"

[[keyboard.bindings]]
key = "Z"
mods = "Alt"
chars = "ż"

[[keyboard.bindings]]
key = "Z"
mods = "Alt|Shift"
chars = "Ż"

# Word-jump on Option+Left/Right (zsh/bash backward-word / forward-word).
# Without these, option_as_alt="Both" sends ESC[1;3D / ESC[1;3C which most
# shells don't bind by default, leaking literal ";3D" into the prompt.
[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001bb"

[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001bf"

# ─── Cmd → vc-frame: the product switcher (key-contract v3) ─────────────────
# Host translates Cmd into kitty CSI-u with super bit so vc-frame sees Super+key
# in EVERY mode including LOCK. Without these, Cmd+arrows/Cmd+E do nothing.
# Source of truth: tools/alacritty/vc-frame.toml in the vc-frame repo.
[[keyboard.bindings]]
key = "Left"
mods = "Command"
chars = "\u001b[1;9D"

[[keyboard.bindings]]
key = "Right"
mods = "Command"
chars = "\u001b[1;9C"

[[keyboard.bindings]]
key = "Up"
mods = "Command"
chars = "\u001b[1;9A"

[[keyboard.bindings]]
key = "Down"
mods = "Command"
chars = "\u001b[1;9B"

[[keyboard.bindings]]
key = "Period"
mods = "Command|Shift"
chars = "\u001b[46;10u"

[[keyboard.bindings]]
key = "E"
mods = "Command"
chars = "\u001b[101;9u"

[scrolling]
# Keep enough output to actually browse after long make/help dumps.
history = 50000
multiplier = 3

[mouse]
hide_when_typing = false
# Split wheel by terminal buffer:
#   ~Alt (primary / normal shell) → Alacritty scrollback
#    Alt (TUI: Atuin, less, vim, … without mouse protocol) → Up/Down keys
# Shift always forces terminal scrollback (bypasses app mouse reporting, e.g. Zellij).
bindings = [
  { mouse = "WheelUp",   mode = "~Alt", action = "ScrollLineUp" },
  { mouse = "WheelDown", mode = "~Alt", action = "ScrollLineDown" },

  { mouse = "WheelUp",   mode = "Alt",  chars = "\u001bOA" },
  { mouse = "WheelDown", mode = "Alt",  chars = "\u001bOB" },

  { mouse = "WheelUp",   mods = "Shift", action = "ScrollLineUp" },
  { mouse = "WheelDown", mods = "Shift", action = "ScrollLineDown" },
]

# Vibecrafted copper palette
[colors.primary]
background = "#0b0b12"
foreground = "#e0def4"

[colors.cursor]
cursor = "#d4a574"
text = "#1a1a2e"

[colors.normal]
black   = "#26233a"
red     = "#eb6f92"
green   = "#a6da95"
yellow  = "#f6c177"
blue    = "#7dc4e4"
magenta = "#c4a7e7"
cyan    = "#117f92"
white   = "#e0def4"

[colors.bright]
black   = "#6e6a86"
red     = "#eb6f92"
green   = "#a6da95"
yellow  = "#f6c177"
blue    = "#7dc4e4"
magenta = "#c4a7e7"
cyan    = "#9ccfd8"
white   = "#e0def4"

# Composer: Shift+Enter inserts a new line.
[[keyboard.bindings]]
key = "Enter"
mods = "Shift"
chars = "\u001b\r"
