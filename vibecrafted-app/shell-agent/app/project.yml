name: Vibecrafted
options:
  bundleIdPrefix: io.vetcoders
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"

targets:
  Vibecrafted:
    type: application
    platform: macOS
    sources:
      - path: Vibecrafted
        excludes:
          - "Bridge/vibecrafted_shell_ffiFFI.h"
          - "Bridge/vibecrafted_shell_ffiFFI.modulemap"
          - "Info.plist"
          - "Vibecrafted.icns"
    preBuildScripts:
      - name: "Build Rust FFI"
        script: |
          export MACOSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET:-14.0}"
          cd "$PROJECT_DIR/../.." && cargo build -p vibecrafted-shell-ffi --release
          ./shell-agent/scripts/fix-dylib-install-names.sh
          cargo run -p vibecrafted-uniffi-bindgen -- generate --library target/release/libvibecrafted_shell_ffi.dylib --language swift --out-dir shell-agent/app/Vibecrafted/Bridge/
          ./shell-agent/scripts/normalize-bindings.sh shell-agent/app/Vibecrafted/Bridge
    settings:
      base:
        MARKETING_VERSION: "4.3.1"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Vibecrafted/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_OBJC_BRIDGING_HEADER: "Vibecrafted/Bridge/vibecrafted_shell_ffiFFI.h"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        OTHER_LDFLAGS:
          - "$(PROJECT_DIR)/../../target/release/libvibecrafted_shell_ffi.a"
          - "-framework"
          - "Security"
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "Carbon"
          - "-framework"
          - "UserNotifications"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Vibecrafted/Bridge"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/../../target/release"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.vetcoders.vibecrafted.dev
          PRODUCT_NAME: VibecraftedDev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: io.vetcoders.vibecrafted
          PRODUCT_NAME: Vibecrafted
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          GCC_OPTIMIZATION_LEVEL: "s"
          SWIFT_COMPILATION_MODE: wholemodule
    dependencies:
      - framework: ../../target/release/libvibecrafted_shell_ffi.dylib
        embed: true
    postBuildScripts:
      - script: |
          bash $SRCROOT/../scripts/fix-dylib-install-names.sh "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          if [[ -x "$BUILT_PRODUCTS_DIR/vc-app-update" ]]; then
            install -m 0755 "$BUILT_PRODUCTS_DIR/vc-app-update" \
              "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/vc-app-update"
          else
            install -m 0755 "$SRCROOT/../../../scripts/vc-app-update.sh" \
              "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/vc-app-update"
          fi
        name: Normalize notification FFI install names
        shell: /bin/bash

  vc-app-update:
    type: tool
    platform: macOS
    sources:
      - path: Helpers/vc-app-update
      - path: Vibecrafted/ProductUpdateReplacement.swift
      - path: Vibecrafted/ProductUpdateTransaction.swift
      - path: Vibecrafted/ProductUpdatePolicy.swift
      - path: Vibecrafted/RuntimePackMenuPolicy.swift
    settings:
      base:
        PRODUCT_NAME: vc-app-update
        PRODUCT_BUNDLE_IDENTIFIER: io.vetcoders.vibecrafted.app-update
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: true
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
