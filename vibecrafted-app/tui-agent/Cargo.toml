[package]
name = "voc"
version = "0.1.1"
autobins = false
edition.workspace = true
license = "MIT"
authors.workspace = true
description = "Voc Agent — the Rust terminal cockpit for Vibecrafted"
readme = "README.md"
homepage = "https://vibecrafted.io"
repository = "https://github.com/vetcoders/vibecrafted"
documentation = "https://docs.rs/voc"

[[bin]]
name = "voc"
path = "src/main.rs"

[[bin]]
name = "vc-admin"
path = "src/bin/vc_admin.rs"

[[bin]]
name = "vc-procs"
path = "src/bin/vc_procs.rs"

[[bin]]
name = "vc-start"
path = "src/bin/vc_start.rs"

[dependencies]
control-core = { path = "../../vibecrafted-server/control-core" }
rmcp-mux = { path = "../mux-agent", version = "0.4.0", package = "rmcp-mux" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
libc = "0.2.186"
notify = "6"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
insta = { version = "1", features = ["filters"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
vt100 = "0.16.2"
