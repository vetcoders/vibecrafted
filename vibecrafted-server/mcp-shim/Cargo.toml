[package]
name = "vc-mcp-shim"
version = "4.4.0"
edition = "2024"
rust-version = "1.85.0"
license = "BUSL-1.1"
authors = ["Vetcoders <agents@vetcoders.io>"]
publish = false
description = "stdio MCP client that speaks HTTP to vc-server /mcp"

[[bin]]
name = "vc-mcp-shim"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sysinfo = "0.33"
