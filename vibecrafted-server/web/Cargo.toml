[package]
name = "vibecrafted-server-web"
version = "4.3.0"
edition = "2024"
rust-version = "1.85.0"
license = "BUSL-1.1"
authors = ["Vetcoders <agents@vetcoders.io>"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vibecrafted-server-web"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
control-core = { path = "../control-core", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_urlencoded = { version = "0.7", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process"], optional = true }
leptos_axum = { version = "0.8", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["fs", "trace"], optional = true }
http-body-util = { version = "0.1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }

console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Document",
    "Element",
    "HtmlElement",
    "Response",
    "Storage",
    "Window",
] }

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:tower",
    "dep:tower-http",
    "dep:http-body-util",
    "dep:futures-util",
    "dep:bytes",
    "dep:http",
    "dep:control-core",
    "dep:serde_urlencoded",
    "dep:chrono",
    "leptos/ssr",
    "leptos_router/ssr",
    "leptos_meta/ssr",
]

[[test]]
name = "control_events_sse"
path = "tests/control_events_sse.rs"
required-features = ["ssr"]

[[test]]
name = "scaffold_status_events"
path = "tests/scaffold_status_events.rs"
required-features = ["ssr"]

[[test]]
name = "server_cli"
path = "tests/server_cli.rs"
required-features = ["ssr"]

[[test]]
name = "run_observation_http"
path = "tests/run_observation_http.rs"
required-features = ["ssr"]

[package.metadata.leptos]
output-name = "vibecrafted-server-web"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
site-addr = "127.0.0.1:3024"
reload-port = 3025
browserquery = "defaults"
env = "DEV"

bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false

lib-profile-release = "wasm-release"
hash-files = false
watch-additional-files = ["public", "styles"]
