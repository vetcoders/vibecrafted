# Self-contained member manifest — intentionally does NOT inherit via
# `*.workspace = true`. The sibling `web` crate (W1-b) pins its own versions
# and the shared `server/Cargo.toml` carries only `[workspace] members`, so
# control-core stays self-sufficient to avoid editing W1-b's shared root.
[package]
name = "control-core"
version = "4.2.4"
edition = "2024"
rust-version = "1.85.0"
license = "BUSL-1.1"
authors = ["Vetcoders <agents@vetcoders.io>"]
repository = "https://github.com/vetcoders/vibecrafted"
publish = false
description = "Typed model of the Vibecrafted control plane (runs + events) plus scaffold artifact review surfaces."

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha2 = "0.10"
libc = "0.2"
